name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check files
        run: |
          test -f index.html
          test -f app.js
          test -f style.css
          test -f favicon.png
          ! grep -R "\.\./" index.html app.js style.css
      - name: Prepare static site
        run: |
          mkdir public
          cp index.html app.js style.css favicon.png public/
          mkdir public/sync
          cp sync/config.js sync/supabase.js sync/sync.js sync/adapter.js sync/sync.css public/sync/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
